// Cotação consultada no navegador; nenhuma taxa fictícia é apresentada.
let rates=null,rateDate='',ratesError='';
async function loadRates(){
 try{
  const r=await fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'});
  if(!r.ok)throw Error('Cotação indisponível');
  const d=await r.json();
  if(d.result!=='success'||!(d.rates?.BRL>0)||!(d.rates?.PYG>0))throw Error('Cotação inválida');
  rates=d.rates;rateDate=d.time_last_update_utc||'';ratesError='';
 }catch(e){ratesError=e.message;rates=null}
 render();
}
function moneyFormat(n,c){return new Intl.NumberFormat(c==='PYG'?'es-PY':'pt-BR',{style:'currency',currency:c,maximumFractionDigits:c==='PYG'?0:2}).format(n)}
function converted(price,currency){
 if(!Number.isFinite(Number(price))||Number(price)<0)return '';
 currency=['PYG','BRL','USD'].includes(currency)?currency:'PYG';
 const amount=Number(price);
 const base=rates?amount/rates[currency]:null;
 return `<div class="currency-box">${['PYG','BRL','USD'].map(c=>`<div class="currency-row"><span>${c==='PYG'?'🇵🇾':c==='BRL'?'🇧🇷':'🇺🇸'} ${c}</span><strong>${c===currency?esc(moneyFormat(amount,c)):base===null?'—':esc(moneyFormat(base*rates[c],c))}</strong></div>`).join('')}<div class="rate-note">${rates?'Valores aproximados · Fonte: open.er-api.com · '+esc(rateDate):'Conversão indisponível no momento; valor original exibido.'}</div></div>`;
}
function priceBlock(x){
 if(!x.real)return `<div class="price">${esc(x.price)}</div>`;
 const cur=x.currency||'PYG';
 if(x.cat==='Aluguéis'){
  const typ=x.rentType||'monthly';
  const daily=typ==='daily'||typ==='both';
  const monthly=typ==='monthly'||typ==='both';
  return (daily?`<div class="small">${t('dailyPrice')}</div>${converted(typ==='both'?x.dailyPrice:x.price,cur)}`:'')+
   (monthly?`<div class="small">${t('monthlyPrice')}</div>${converted(typ==='both'?x.monthlyPrice:x.price,cur)}`:'');
 }
 return converted(x.priceValue??x.price,cur);
}

 return `<div class="rent-options" id="${prefix}rentFields" style="display:none"><label class="formlabel">${t('rentType')}</label><select class="field" name="rentType"><option value="daily">${t('daily')}</option><option value="monthly" selected>${t('monthly')}</option><option value="both">${t('both')}</option></select><div id="${prefix}rentExtra" style="display:none"><label class="formlabel">${t('dailyPrice')}</label><input class="field" type="number" min="0" step="any" name="dailyPrice"><label class="formlabel">${t('monthlyPrice')}</label><input class="field" type="number" min="0" step="any" name="monthlyPrice"></div></div>`;
}

 const f=$(prefix==='new'?'productform':'revisionform');if(!f)return;

}

function availableCities(arr){const map=new Map();arr.forEach(x=>{const city=String(x.city||'').trim(),key=normalizedCity(city);if(key&&key!=='paraguai'&&!map.has(key))map.set(key,city)});return [...map.values()].sort((a,b)=>a.localeCompare(b,'pt-BR'))}

function render(){let h='';
if(page==='home')h=`<header><div class="pin">📍</div><div class="logo"><em>Que</em> <span>Buscas</span></div><div class="stripe"></div><div class="tag">PARAGUAI 🇵🇾</div><div class="sub">${t('title')}</div>${langPicker()}</header><main class="wrap">${cats.map((c,i)=>`<button class="cat ${c[2]}" data-cat="${i}"><span class="ico">${c[1]}</span>${c[0]}<span class="arrow">›</span></button>`).join('')}<button class="cat teal" data-go="advertise"><span class="ico">🏪</span>Quero anunciar<span class="arrow">›</span></button><p class="small" style="text-align:center">Os exemplos de imóveis e serviços são demonstrativos. Anúncios reais só aparecem após aprovação.</p></main>`;
else if(['category','search','favorites'].includes(page)){const title=page==='category'?category:page==='search'?'Buscar anúncios':'Meus favoritos';const arr=allItems().filter(x=>(page==='category'?x.cat===category:page==='favorites'?isFav(x.id):true)&&(!searchText||[x.title,x.city,x.cat].join(' ').toLowerCase().includes(searchText.toLowerCase()))&&(!cityFilter||normalizedCity(x.city)===normalizedCity(cityFilter))&&(rentFilter==='all'||x.cat!=='Aluguéis'||(x.rentType||'monthly')===rentFilter||(x.rentType==='both'&&['daily','monthly'].includes(rentFilter))));const cities=availableCities(allItems().filter(x=>page!=='category'||x.cat===category));h=`<div class="top"><button class="back" data-go="home">‹ Voltar</button><h1 class="title">${esc(title)}</h1></div><main class="wrap">${langPicker()}${page==='category'?`<div class="card"><div class="card-body"><label class="formlabel" for="categoryCity">📍 Selecione a cidade</label><select class="field" id="categoryCity"><option value="">Todas as cidades</option>${cities.map(c=>`<option value="${esc(c)}" ${normalizedCity(c)===normalizedCity(cityFilter)?'selected':''}>${esc(c)}</option>`).join('')}</select><p class="hint" style="margin:0">${arr.length} anúncio(s) encontrado(s)</p></div></div>`:''}${page==='search'?`<div class="filters"><input class="field" id="q" placeholder="Buscar imóvel, serviço, cidade..." value="${esc(searchText)}"><select class="field" id="city"><option value="">Todas as cidades</option>${availableCities(allItems()).map(c=>`<option value="${esc(c)}" ${normalizedCity(c)===normalizedCity(cityFilter)?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="secondary" id="filter">Pesquisar</button></div>`:''}${page==='category'&&category==='Aluguéis'?`<label class="formlabel">${t('rentFilter')}</label><select class="field" id="rentFilter"><option value="all">${t('all')}</option><option value="daily" ${rentFilter==='daily'?'selected':''}>${t('daily')}</option><option value="monthly" ${rentFilter=== else if(page==='login')h=`<div class="top"><button class="back" data-go="home">‹ Voltar</button><h1 class="title">Entrar com Google</h1></div><main class="wrap"><div class="card"><div class="card-body"><p>Entre com sua conta Google para demonstrar interesse em um anúncio.</p><button class="primary wide" id="google">🌐 Continuar com Google</button><p class="small">O acesso de parceiros, atendentes e administradores depende de autorização.</p></div></div></main>`;
else if(page==='chat'){const x=allItems().find(y=>String(y.id)===String(selected)),arr=messages[selected]||[];h=`<div class="top"><button class="back" data-go="detail">‹ Voltar</button><h1 class="title">Chat de teste</h1></div><main class="wrap"><p class="muted">Sobre: ${esc(x?.title||'Anúncio')} • ${esc(x?.city||'Paraguai')}</p><div class="chatlog" id="chatlog"><div class="bubble bot">Olá! Esta é uma demonstração do chat. As mensagens ficam somente neste aparelho e não chegam à equipe.</div>${arr.map(m=>`<div class="bubble">${esc(m)}</div>`).join('')}</div><form id="sendform" class="actions"><input class="field" id="msg" style="margin:0;min-width:0;flex:1" placeholder="Escreva sua mensagem" required><button class="primary" type="submit">Enviar</button></form></main>`}
else if(page==='advertise')h=`<div class="top"><button class="back" data-go="home">‹ Voltar</button><h1 class="title">Quero anunciar</h1></div><main class="wrap">${!user?`<div class="card"><div class="card-body"><h3>Cadastre seu negócio</h3><p>Entre com Google para solicitar autorização para anunciar no Que Buscas Paraguai.</p><button class="primary wide" id="google">🌐 Entrar com Google</button></div></div>`:storeBusy?'<div class="empty">Verificando seu cadastro...</div>':!store?`<div class="card"><div class="card-body"><h3>Cadastro de anunciante</h3><p class="hint">Seu cadastro será analisado antes de você poder enviar anúncios.</p><form id="storeform"><label class="formlabel">Nome da loja ou anunciante *</label><input class="field" name="name" maxlength="120" required placeholder="Ex.: Loja Centro Paraguai"><label class="formlabel">Categoria</label><select class="field" name="category"><option>Comércio</option><option>Imobiliária</option><option>Restaurante</option><option>Serviços</option><option>Outros</option></select><label class="formlabel">Cidade no Paraguai</label><input class="field" name="city" maxlength="100" placeholder="Ex.: Ciudad del Este"><label class="formlabel">WhatsApp para contato</label><input class="field" name="phone" maxlength="40" placeholder="Ex.: +595..."><label class="formlabel">Sobre o negócio</label><textarea class="field" name="description" maxlength="1000" rows="3" placeholder="Conte um pouco sobre seu negócio"></textarea><button class="primary wide" type="submit">Enviar cadastro para aprovação</button></form></div></div>`:`<div class="card"><div class="card-body"><h3>${esc(store.name)}</h3><div class="status ${store.status==='approved'?'good':store.status==='rejected'?'danger':'warn'}">${statusLabel(store.status)}</div><p class="hint">${store.status==='approved'?'Seu cadastro foi autorizado. Você pode enviar anúncios para aprovação.':store.status==='rejected'?'Seu cadastro não foi aprovado. Entre em contato com a equipe.':'Sua solicitação foi recebida. Aguarde a análise da equipe antes de enviar produtos.'}</p>${store.status==='approved'?'<button class="primary wide" data-go="seller">Abrir minha loja →</button>':''}<button class="secondary wide" id="refreshstore" style="margin-top:10px">Atualizar situação</button></div></div>`}</main>`;
else if(page==='seller')h=`<div class="top"><button class="back" data-go="advertise">‹ Voltar</button><h1 class="title">Minha loja</h1></div><main class="wrap">${!user||!store||store.status!=='approved'?'<div class="empty">Seu cadastro precisa estar aprovado para acessar esta área.</div>':`<div class="card"><div class="card-body"><h3>${esc(store.name)}</h3><p class="hint">Todos os anúncios novos precisam de aprovação. Alterações em anúncios aprovados também serão revisadas.</p><form id="productform"><label class="formlabel">Título do anúncio *</label><input class="field" name="name" maxlength="160" required><label class="formlabel">${t('currency')}</label><select class="field" name="currency"><option value="PYG">🇵🇾 Guarani (PYG)</option><option value="BRL">🇧🇷 Real (BRL)</option><option value="USD">🇺🇸 Dólar (USD)</option></select><label class="formlabel" id="newpriceLabel">${t('price')} *</label><input class="field" name="price" type="number" min="0" step="any" required><label class="formlabel">Categoria</label><select class="field" name="category"><option>Terrenos</option><option>Imóveis à venda</option><option>Aluguéis</option><option>Serviços</option><option>Restaurantes</option><option>Comércios</option></select>${rentalFields('new')}<label class="formlabel">Descrição</label><textarea class="field" name="description" rows="4" maxlength="2000"></textarea>${photoInput('new')}<button class="primary wide" type="submit">Enviar anúncio para aprovação</button></form></div></div><h3 class="section">Meus anúncios enviados</h3>${myProductsBusy?'<p class="hint">Carregando...</p>':myProducts.length?myProducts.map(p=>`<div class="card">${photo({...p,title:p.name})}<div class="card-body"><h3>${esc(p.name)}</h3><div class="status ${p.status==='approved'?'good':p.status==='rejected'?'danger':'warn'}">${statusLabel(p.status)}</div>${priceBlock({...p,real:true,cat:p.category,priceValue:p.price})}${p.status==='approved'?`<button class="secondary" data-edit="${esc(p.id)}">Solicitar alteração</button>`:''}</div></div>`).join(''):'<p class="hint">Você ainda não enviou anúncios.</p>'}<button class="secondary wide" id="refreshproducts">Atualizar meus anúncios</button>`}</main>`;
else if(page==='editproduct'){const p=myProducts.find(x=>x.id===selected);h=`<div class="top"><button class="back" data-go="seller">‹ Voltar</button><h1 class="title">Solicitar alteração</h1></div><main class="wrap">${p&&store?.status==='approved'?`<div class="card"><div class="card-body"><p class="hint">A versão publicada continuará visível até sua alteração ser aprovada.</p><form id="revisionform"><label class="formlabel">Nome</label><input class="field" name="name" maxlength="160" required value="${esc(p.name)}"><label class="formlabel">${t('currency')}</label><select class="field" name="currency">${['PYG','BRL','USD'].map(c=>`<option value="${c}" ${(p.currency||'PYG')===c?'selected':''}>${c}</option>`).join('')}</select><label class="formlabel" id="revisionpriceLabel">${t('price')}</label><input class="field" name="price" type="number" min="0" step="any" required value="${Number(p.price)}"><label class="formlabel">Categoria</label><select class="field" name="category">${cats.map(c=>`<option value="${esc(c[0])}" ${p.category===c[0]?'selected':''}>${esc(c[0])}</option>`).join('')}</select>${rentalFields('revision')}<label class="formlabel">Descrição</label><textarea class="field" name="description" rows="4" maxlength="2000">${esc(p.description||'')}</textarea><label class="formlabel">Fotos atuais</label>${gallery(p)||'<p class="hint">Sem fotos cadastradas.</p>'}<p class="hint">Se selecionar novas fotos, elas substituirão a galeria atual somente após aprovação. Deixe vazio para manter as fotos existentes.</p>${photoInput('revision')}<button class="primary wide" type="submit">Enviar alterações para aprovação</button></form></div></div>`:'<div class="empty">Produto indisponível.</div>'}</main>`}
else if(page==='profile')h=`<div class="top"><button class="back" data-go="home">‹ Voltar</button><h1 class="title">Meu perfil</h1></div><main class="wrap"><div class="card"><div class="card-body">${user?`<h3>${esc(user.name)}</h3><p>${esc(user.email)}</p><div class="split"><button class="primary" data-go="advertise">🏪 Área do anunciante</button><button class="secondary" id="logout">Sair da conta Google</button></div>${adminAuthorized?`<div class="admin-entry"><div class="admin-entry-icon">🛡️</div><div><strong>Central de Administração</strong><p class="hint" style="margin:5px 0 12px">Gerencie aprovações, anunciantes e solicitações com acesso restrito.</p></div><button class="primary wide" id="openadmin">Abrir painel administrativo →</button></div>`:adminChecking?`<p class="hint">Verificando permissões da conta...</p>`:``}`:`<p>Você está navegando como visitante.</p><button class="primary" data-go="login">Entrar com Google</button>`}</div></div></main>`;
$('app').innerHTML=h;$('nav').innerHTML=[['home','⌂',t('home')],['search','⌕',t('search')],['favorites','♡',t('favorites')],['advertise','🏪',t('advertise')],['profile','♙',t('profile')]].map(x=>`<button data-go="${x[0]}" class="${page===x[0]?'active':''}"><b>${x[1]}</b>${x[2]}</button>`).join('');if(page==='chat')$('chatlog').scrollTop=$('chatlog').scrollHeight;if(page==='seller'){previewFiles('new');toggleRental('new')}if(page==='editproduct'){previewFiles('revision');const f=$('revisionform'),p=myProducts.find(x=>x.id===selected);if(f&&p){f.elements.rentType.value=p.rentType||'monthly';if(p.rentType==='both'){f.elements.dailyPrice.value=p.dailyPrice||'';f.elements.monthlyPrice.value=p.monthlyPrice||''}}toggleRental('revision')}}
function go(p){if(uploadBusy)return notice('Aguarde o envio das fotos terminar.');page=p;if(p==='search'||p==='category')loadPublicProducts();if(p==='home'){searchText='';cityFilter='';category=''}window.scrollTo(0,0);render()}
async function loadStore(){const uid=user?.uid;if(!uid)return;storeBusy=true;render();try{const snap=await getDoc(doc(db,'stores',uid));if(user?.uid===uid)store=snap.exists()?{id:snap.id,...snap.data()}:null}catch(err){console.error(err);notice('Não foi possível consultar seu cadastro.')}finally{storeBusy=false;render()}}
async function loadMyProducts(){const uid=user?.uid;if(!uid)return;myProductsBusy=true;render();try{const ids=get('my_products_'+uid,[]);const found=await Promise.all(ids.map(async id=>{try{const s=await getDoc(doc(db,'products',id));return s.exists()?{id:s.id,...s.data()}:null}catch{return null}}));if(user?.uid===uid)myProducts=found.filter(Boolean)}finally{myProductsBusy=false;render()}}
async function loadPublicProducts(){realLoading=true;realError='';render();try{const snap=await getDocs(query(collection(db,'products'),where('status','==','approved')));realItems=snap.docs.map(d=>({id:d.id,...d.data(),cat:d.data().category||'Comércios',title:d.data().name||'Anúncio',city:d.data().city||'Paraguai',priceValue:d.data().price,price:d.data().price,currency:d.data().currency||'PYG',rentType:d.data().rentType||'monthly',dailyPrice:d.data().dailyPrice,monthlyPrice:d.data().monthlyPrice,desc:d.data().description||'',icon:'📦',real:true}))}catch(err){console.error(err);realError='Não foi possível carregar anúncios publicados.'}finally{realLoading=false;render()}}
function addFiles(which,fileList){const current=which==='new'?newFiles:revisionFiles;for(const file of Array.from(fileList)){if(current.length>=MAX_PHOTOS){notice('Limite de 5 fotos por anúncio.');break}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){notice('Use somente JPG, PNG ou WebP.');continue}if(!file.size||file.size>MAX_FILE_BYTES){notice('Cada foto deve ter no máximo 5 MB.');continue}if(!current.some(f=>f.name===file.name&&f.size===file.size&&f.lastModified===file.lastModified))current.push(file)}previewFiles(which)}
async function uploadFiles(files,which){if(!files.length)return [];if(!auth.currentUser)throw new Error('Entre novamente com Google.');const token=await auth.currentUser.getIdToken(true),urls=[];for(let i=0;i<files.length;i++){const progress=$(which+'Progress');if(progress)progress.textContent=`Enviando foto ${i+1} de ${files.length}...`;const data=new FormData();data.append('file',files[i],files[i].name);let response;try{response=await fetch(WORKER+'/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:data})}catch{throw new Error('Falha de conexão com o serviço de fotos.')}let result={};try{result=await response.json()}catch{}if(!response.ok||!result.ok||typeof result.url!=='string')throw new Error(result.error||'Falha ao enviar a foto '+(i+1));urls.push(result.url)}return urls}
async function withUpload(form,which,operation){if(uploadBusy)return;uploadBusy=true;const btn=form.querySelector('button[type=submit]');btn.disabled=true;const oldText=btn.textContent;btn.textContent='Aguarde, enviando...';try{const files=[...(which==='new'?newFiles:revisionFiles)];const urls=await uploadFiles(files,which);await operation(urls);if(which==='new')newFiles=[];else revisionFiles=[]}catch(err){console.error(err);notice(err.message||'Erro ao enviar anúncio.');const progress=$(which+'Progress');if(progress)progress.textContent='Envio não concluído. Confira sua conexão e tente novamente.'}finally{uploadBusy=false;btn.disabled=false;btn.textContent=oldText}}
async function checkAdmin(uid){
  adminAuthorized=false;
  adminChecking=true;
  render();
  try{
    const snapshot=await getDoc(doc(db,'users',uid));
    if(user?.uid===uid){
      const data=snapshot.exists()?snapshot.data():null;
      adminAuthorized=data?.role==='admin'&&data?.active===true;
    }
  }catch(err){
    console.error('Falha ao verificar acesso administrativo:',err);
    if(user?.uid===uid)adminAuthorized=false;
  }finally{
    if(user?.uid===uid){adminChecking=false;render()}
  }
}
onAuthStateChanged(auth,account=>{user=account?{name:account.displayName||'Usuário',email:account.email||'',uid:account.uid}:null;adminAuthorized=false;adminChecking=false;if(user){loadStore();loadMyProducts();checkAdmin(user.uid)}else{store=null;myProducts=[]}if(page==='login'&&user){go(pending?'chat':'profile');pending=null}else render()});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.lang){lang=b.dataset.lang;localStorage.setItem('qb_lang',lang);render();return}if(b.dataset.removePhoto){const [which,index]=b.dataset.removePhoto.split(':');const files=which==='new'?newFiles:revisionFiles;files.splice(Number(index),1);previewFiles(which);return}if(b.dataset.cat!==undefined){category=cats[Number(b.dataset.cat)][0];searchText='';cityFilter='';go('category')}else if(b.dataset.detail){selected=b.dataset.detail;go('detail')}else if(b.dataset.fav){const id=String(b.dataset.fav);favorites=isFav(id)?favorites.filter(x=>x!==id):[...favorites,id];put('favorites',favorites);render()}else if(b.dataset.interest){selected=b.dataset.interest;if(user)go('chat');else{pending=selected;go('login')}}else if(b.dataset.edit){selected=b.dataset.edit;revisionFiles=[];go('editproduct')}else if(b.dataset.go)go(b.dataset.go);else if(b.id==='openadmin'){if(adminAuthorized&&auth.currentUser?.uid===user?.uid){window.location.assign('./admin.html')}else notice('Acesso administrativo não autorizado.')}else if(b.id==='refreshstore')loadStore();else if(b.id==='refreshproducts')loadMyProducts();else if(b.id==='google')signInWithPopup(auth,provider).catch(err=>{console.error(err);notice(err.code==='auth/popup-blocked'?'Permita pop-ups para entrar com Google.':err.code==='auth/unauthorized-domain'?'Domínio não autorizado no Firebase.':'Não foi possível entrar com Google.')});else if(b.id==='filter'){searchText=$('q').value.trim();cityFilter=$('city').value;render()}else if(b.id==='logout')signOut(auth).then(()=>go('profile')).catch(()=>notice('Não foi possível sair.'))});
document.addEventListener('change',e=>{if(e.target.id==='rentFilter'){rentFilter=e.target.value;render()}else if(e.target.matches('#productform select[name=category],#productform select[name=rentType]')){toggleRental('new')}else if(e.target.matches('#revisionform select[name=category],#revisionform select[name=rentType]')){toggleRental('revision')}else if(e.target.id==='categoryCity'){cityFilter=e.target.value;render()}else if(e.target.id==='newPhotos'||e.target.id==='revisionPhotos'){addFiles(e.target.id==='newPhotos'?'new':'revision',e.target.files);e.target.value=''}});
document.addEventListener('submit',async e=>{
if(e.target.id==='storeform'){e.preventDefault();if(!user)return notice('Entre com Google primeiro.');const f=e.target,b=f.querySelector('button[type=submit]');b.disabled=true;const data={ownerId:user.uid,name:f.elements.name.value.trim(),category:f.elements.category.value,city:f.elements.city.value.trim(),phone:f.elements.phone.value.trim(),description:f.elements.description.value.trim(),status:'pending',createdAt:serverTimestamp()};try{await setDoc(doc(db,'stores',user.uid),data);notice('Cadastro enviado para aprovação!');await loadStore()}catch(err){console.error(err);notice('Erro ao enviar cadastro. Confira sua conexão.')}finally{b.disabled=false}return}
if(e.target.id==='productform'){e.preventDefault();if(!user||store?.status!=='approved')return notice('Cadastro ainda não aprovado.');const f=e.target;await withUpload(f,'new',async urls=>{const data={ownerId:user.uid,storeId:user.uid,name:f.elements.name.value.trim(),price:Number(f.elements.price.value),currency:f.elements.currency.value,category:f.elements.category.value,description:f.elements.description.value.trim(),imageUrls:urls,status:'pending',createdAt:serverTimestamp()};if(data.category==='Aluguéis'){data.rentType=f.elements.rentType.value;if(data.rentType==='both'){data.dailyPrice=Number(f.elements.dailyPrice.value);data.monthlyPrice=Number(f.elements.monthlyPrice.value);if(!f.elements.dailyPrice.value||!f.elements.monthlyPrice.value)throw Error('Informe os dois valores do aluguel.')}}const ref=await addDoc(collection(db,'products'),data);const ids=get('my_products_'+user.uid,[]);put('my_products_'+user.uid,[ref.id,...ids]);notice('Anúncio e fotos enviados para aprovação!');f.reset();await loadMyProducts()});return}
if(e.target.id==='revisionform'){e.preventDefault();if(!user||store?.status!=='approved')return notice('Acesso não autorizado.');const p=myProducts.find(x=>x.id===selected);if(!p)return notice('Produto não encontrado.');const f=e.target;await withUpload(f,'revision',async urls=>{const changes={name:f.elements.name.value.trim(),price:Number(f.elements.price.value),currency:f.elements.currency.value,category:f.elements.category.value,description:f.elements.description.value.trim()};if(changes.category==='Aluguéis'){changes.rentType=f.elements.rentType.value;if(changes.rentType==='both'){changes.dailyPrice=Number(f.elements.dailyPrice.value);changes.monthlyPrice=Number(f.elements.monthlyPrice.value);if(!f.elements.dailyPrice.value||!f.elements.monthlyPrice.value)throw Error('Informe os dois valores do aluguel.')}}if(urls.length)changes.imageUrls=urls;await addDoc(collection(db,'product_revisions'),{ownerId:user.uid,productId:p.id,changes,status:'pending',createdAt:serverTimestamp()});notice('Alterações enviadas para aprovação!');page='seller';render()});return}
if(e.target.id==='sendform'){e.preventDefault();const t=$('msg').value.trim();if(!t)return;(messages[selected]??=[]).push(t);put('messages',messages);render()}});
getRedirectResult(auth).catch(err=>console.warn('Retorno do Google:',err.code));loadPublicProducts();loadRates();render();
</script></body></html>
