  apiKey: "AIzaSyCjZ7bXEYtNzgIaScbsLjRKt0fCjq_IyX8",

let user=null,favorites=get('favorites',[]),messages=get('messages',{}),page='home',category='',selected=null,pending=null,searchText='',cityFilter='',store=null,storeBusy=false,realItems=[],realLoading=false,realError='',myProducts=[],myProductsBusy=false;
onAuthStateChanged(auth, account => {
  user = account ? {name:account.displayName||'Usuário', email:account.email||'', phone:'', uid:account.uid} : null;
  if(user){loadStore();loadMyProducts();}
  else {store=null;myProducts=[];}
  if (page==='login' && user) { go(pending ? 'chat' : 'profile'); pending=null; }
  else render();

async function loadStore(){
  if(!user)return;storeBusy=true;render();
  try{const snap=await getDoc(doc(db,'stores',user.uid));store=snap.exists()?{id:snap.id,...snap.data()}:null;}
  catch(err){console.error(err);notice('Não foi possível consultar seu cadastro.');}
  finally{storeBusy=false;render();}
}
async function loadMyProducts(){
  if(!user)return;myProductsBusy=true;
  const ids=get('my_products_'+user.uid,[]);
  try{const found=await Promise.all(ids.map(async id=>{try{const s=await getDoc(doc(db,'products',id));return s.exists()?{id:s.id,...s.data()}:null}catch{return null}}));myProducts=found.filter(Boolean);}
  finally{myProductsBusy=false;render();}
}
async function loadPublicProducts(){
  realLoading=true;realError='';render();
  try{const snap=await getDocs(query(collection(db,'products'),where('status','==','approved')));
    realItems=snap.docs.map(d=>({id:d.id,...d.data(),cat:d.data().category||'Produtos',title:d.data().name||'Produto',city:d.data().city||'Paraguai',price:'Gs. '+Number(d.data().price||0).toLocaleString('es-PY'),desc:d.data().description||'',icon:'📦',real:true}));
  }catch(err){console.error(err);realError='Não foi possível carregar anúncios publicados.';}
  finally{realLoading=false;render();}
}
function statusLabel(status){return status==='approved'?'Aprovado':status==='rejected'?'Rejeitado':'Aguardando aprovação';}
function notice(t){$('notice').textContent=t;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',2600)}
function render(){let h='';if(page==='home'){h=`<header><div class="pin">📍</div><div class="logo"><em>Que</em> <span>Buscas</span></div><div class="stripe"></div><div class="tag">PARAGUAI 🇵🇾</div><div class="sub">Encontre o que procura no Paraguai</div></header><main class="wrap">${cats.map((c,i)=>`<button class="cat ${c[2]}" data-cat="${i}"><span class="ico">${c[1]}</span>${c[0]}<span class="arrow">›</span></button>`).join('')}<button class="cat teal" data-go="advertise"><span class="ico">🏪</span>Quero anunciar<span class="arrow">›</span></button><p class="small" style="text-align:center">Os exemplos de imóveis e serviços são demonstrativos. Anúncios reais só aparecem após aprovação.</p></main>`}
else if(page==='category'||page==='search'||page==='favorites'){let title=page==='category'?category:page==='search'?'Buscar anúncios':'Meus favoritos';let arr=[...items,...realItems].filter(x=>(page==='category'?x.cat===category:page==='favorites'?favorites.includes(x.id):true)&&(!searchText||[x.title,x.city,x.cat].join(' ').toLowerCase().includes(searchText.toLowerCase()))&&(!cityFilter||x.city===cityFilter));h=`<div class="top"><button class="back" data-go="home">‹ Voltar</button><h1 class="title">${esc(title)}</h1></div><main class="wrap">${page==='search'?`<div class="filters"><input class="field" id="q" placeholder="Buscar imóvel, serviço, cidade..." value="${esc(searchText)}"><select class="field" id="city"><option value="">Todas as cidades</option>${[...new Set([...items,...realItems].map(x=>x.city))].map(x=>`<option ${x===cityFilter?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="secondary" id="filter">Pesquisar</button></div>`:''}${arr.length?arr.map(card).join(''):'<div class="empty">Nenhum anúncio encontrado.</div>'}</main>`}
else if(page==='detail'){let x=[...items,...realItems].find(y=>String(y.id)===String(selected));h=`<div class="top"><button class="back" data-go="${category?'category':'search'}">‹ Voltar</button><h1 class="title">Detalhes</h1></div><main class="wrap"><div class="card"><div class="photo">${x.icon}</div><div class="card-body"><span class="pill">${esc(x.cat)}</span><h3 style="margin-top:12px">${esc(x.title)}</h3><div class="muted">📍 ${esc(x.city)}, Paraguai</div><div class="price">${esc(x.price)}</div><p>${esc(x.desc)}</p><div class="actions"><button class="primary" data-interest="${x.id}">💬 Tenho interesse</button><button class="secondary" data-fav="${x.id}">${favorites.includes(x.id)?'♥':'♡'}</button></div></div></div>${x.real?'<p class="small">Anúncio aprovado pela equipe.</p>':'<p class="small">Anúncio fictício para teste da navegação.</p>'}</main>`}
else if(page==='login'){h=`<div class="top"><button class="back" data-go="home">‹ Voltar</button><h1 class="title">Entrar com Google</h1></div><main class="wrap"><div class="card"><div class="card-body"><p>Entre com sua conta Google para demonstrar interesse em um imóvel.</p><button class="primary" style="width:100%" id="google">🌐 Continuar com Google</button><p class="small">O acesso de parceiros, atendentes e administradores será liberado separadamente, após autorização.</p></div></div></main>`}
else if(page==='chat'){let x=[...items,...realItems].find(y=>String(y.id)===String(selected)),arr=messages[selected]||[];h=`<div class="top"><button class="back" data-go="detail">‹ Voltar</button><h1 class="title">Chat de teste</h1></div><main class="wrap"><p class="muted">Sobre: ${esc(x.title)} • ${esc(x.city)}</p><div class="chatlog" id="chatlog"><div class="bubble bot">Olá! Esta é uma demonstração do chat. As mensagens ficam somente neste aparelho e não chegam à equipe.</div>${arr.map(m=>`<div class="bubble">${esc(m)}</div>`).join('')}</div><form id="sendform" class="actions"><input class="field" id="msg" style="margin:0;min-width:0;flex:1" placeholder="Escreva sua mensagem" required><button class="primary" type="submit">Enviar</button></form></main>`}
else if(page==='advertise'){
  h=`<div class="top"><button class="back" data-go="home">‹ Voltar</button><h1 class="title">Quero anunciar</h1></div><main class="wrap">${!user?`<div class="card"><div class="card-body"><h3>Cadastre seu negócio</h3><p>Entre com Google para solicitar autorização para anunciar no Que Buscas Paraguai.</p><button class="primary wide" id="google">🌐 Entrar com Google</button></div></div>`:storeBusy?'<div class="empty">Verificando seu cadastro...</div>':!store?`<div class="card"><div class="card-body"><h3>Cadastro de anunciante</h3><p class="hint">Seu cadastro será analisado antes de você poder enviar produtos.</p><form id="storeform"><label class="formlabel">Nome da loja ou anunciante *</label><input class="field" name="name" maxlength="120" required placeholder="Ex.: Loja Centro Paraguai"><label class="formlabel">Categoria</label><select class="field" name="category"><option>Comércio</option><option>Imobiliária</option><option>Restaurante</option><option>Serviços</option><option>Outros</option></select><label class="formlabel">Cidade no Paraguai</label><input class="field" name="city" maxlength="100" placeholder="Ex.: Ciudad del Este"><label class="formlabel">WhatsApp para contato</label><input class="field" name="phone" maxlength="40" placeholder="Ex.: +595..."><label class="formlabel">Sobre o negócio</label><textarea class="field" name="description" maxlength="1000" rows="3" placeholder="Conte um pouco sobre seu negócio"></textarea><button class="primary wide" type="submit">Enviar cadastro para aprovação</button></form></div></div>`:`<div class="card"><div class="card-body"><h3>${esc(store.name)}</h3><div class="status ${store.status==='approved'?'good':store.status==='rejected'?'danger':'warn'}">${statusLabel(store.status)}</div><p class="hint">${store.status==='approved'?'Seu cadastro foi autorizado. Você pode enviar produtos para aprovação.':store.status==='rejected'?'Seu cadastro não foi aprovado. Entre em contato com a equipe.':'Sua solicitação foi recebida. Aguarde a análise da equipe antes de enviar produtos.'}</p>${store.status==='approved'?'<button class="primary wide" data-go="seller">Abrir minha loja →</button>':''}<button class="secondary wide" id="refreshstore" style="margin-top:10px">Atualizar situação</button></div></div>`}</main>`;
}
else if(page==='seller'){
  h=`<div class="top"><button class="back" data-go="advertise">‹ Voltar</button><h1 class="title">Minha loja</h1></div><main class="wrap">${!user||!store||store.status!=='approved'?'<div class="empty">Seu cadastro precisa estar aprovado para acessar esta área.</div>':`<div class="card"><div class="card-body"><h3>${esc(store.name)}</h3><p class="hint">Todos os produtos novos precisam de aprovação. Para editar um produto aprovado, a alteração também será revisada.</p><form id="productform"><label class="formlabel">Nome do produto *</label><input class="field" name="name" maxlength="160" required><label class="formlabel">Preço em guaranis (Gs.) *</label><input class="field" name="price" type="number" min="0" step="1" required><label class="formlabel">Categoria</label><select class="field" name="category"><option>Produtos</option><option>Eletrônicos</option><option>Casa e decoração</option><option>Moda</option><option>Alimentos</option><option>Outros</option></select><label class="formlabel">Descrição</label><textarea class="field" name="description" rows="4" maxlength="2000"></textarea><p class="hint">Fotos serão adicionadas na próxima etapa, após configurarmos o armazenamento seguro de imagens.</p><button class="primary wide" type="submit">Enviar produto para aprovação</button></form></div></div><h3 class="section">Meus produtos enviados</h3>${myProductsBusy?'<p class="hint">Carregando...</p>':myProducts.length?myProducts.map(p=>`<div class="card"><div class="card-body"><h3>${esc(p.name)}</h3><div class="status ${p.status==='approved'?'good':p.status==='rejected'?'danger':'warn'}">${statusLabel(p.status)}</div><p>Gs. ${Number(p.price||0).toLocaleString('es-PY')}</p>${p.status==='approved'?`<button class="secondary" data-edit="${esc(p.id)}">Solicitar alteração</button>`:''}</div></div>`).join(''):'<p class="hint">Você ainda não enviou produtos.</p>'}<button class="secondary wide" id="refreshproducts">Atualizar meus produtos</button>`}</main>`;
}
else if(page==='editproduct'){
  const p=myProducts.find(x=>x.id===selected);
  h=`<div class="top"><button class="back" data-go="seller">‹ Voltar</button><h1 class="title">Solicitar alteração</h1></div><main class="wrap">${p&&store?.status==='approved'?`<div class="card"><div class="card-body"><p class="hint">A versão publicada continuará visível até sua alteração ser aprovada.</p><form id="revisionform"><label class="formlabel">Nome</label><input class="field" name="name" maxlength="160" required value="${esc(p.name)}"><label class="formlabel">Preço em Gs.</label><input class="field" name="price" type="number" min="0" step="1" required value="${Number(p.price)}"><label class="formlabel">Descrição</label><textarea class="field" name="description" rows="4" maxlength="2000">${esc(p.description||'')}</textarea><button class="primary wide" type="submit">Enviar alterações para aprovação</button></form></div></div>`:'<div class="empty">Produto indisponível.</div>'}</main>`;
}
else if(page==='profile'){h=`<div class="top"><button class="back" data-go="home">‹ Voltar</button><h1 class="title">Meu perfil</h1></div><main class="wrap"><div class="card"><div class="card-body">${user?`<h3>${esc(user.name)}</h3><p>${esc(user.email)}<br></p><div class="split"><button class="primary" data-go="advertise">🏪 Área do anunciante</button><button class="secondary" id="logout">Sair da conta Google</button></div>`:`<p>Você está navegando como visitante.</p><button class="primary" data-go="login">Entrar com Google</button>`}</div></div></main>`}
$('app').innerHTML=h;$('nav').innerHTML=[['home','⌂','Início'],['search','⌕','Buscar'],['favorites','♡','Favoritos'],['advertise','🏪','Anunciar'],['profile','♙','Perfil']].map(x=>`<button data-go="${x[0]}" class="${page===x[0]?'active':''}"><b>${x[1]}</b>${x[2]}</button>`).join('');if(page==='chat')$('chatlog').scrollTop=$('chatlog').scrollHeight;}
function card(x){return `<div class="card"><div class="photo">${x.icon}</div><div class="card-body"><span class="pill">${esc(x.cat)}</span><h3 style="margin-top:10px">${esc(x.title)}</h3><div class="muted">📍 ${esc(x.city)}</div><div class="price">${esc(x.price)}</div><div class="actions"><button class="primary" data-detail="${x.id}">Ver detalhes →</button><button class="secondary" data-fav="${x.id}">${favorites.includes(x.id)?'♥':'♡'}</button></div></div></div>`}
function go(p){page=p;if(p==='search')loadPublicProducts();if(p==='home'){searchText='';cityFilter='';category=''}window.scrollTo(0,0);render()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.cat!==undefined){category=cats[+b.dataset.cat][0];searchText='';cityFilter='';go('category')}else if(b.dataset.detail){selected=b.dataset.detail;go('detail')}else if(b.dataset.fav){let id=+b.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];put('favorites',favorites);render()}else if(b.dataset.interest){selected=b.dataset.interest;if(user)go('chat');else{pending=selected;go('login')}}else if(b.dataset.edit){selected=b.dataset.edit;go('editproduct')}else if(b.dataset.go){go(b.dataset.go)}else if(b.id==='refreshstore'){loadStore()}else if(b.id==='refreshproducts'){loadMyProducts()}else if(b.id==='google'){signInWithPopup(auth,provider).catch(err=>{console.error(err);notice(err.code==='auth/popup-blocked'?'O navegador bloqueou a janela de login. Permita pop-ups e tente novamente.':err.code==='auth/unauthorized-domain'?'Domínio não autorizado no Firebase.':'Não foi possível entrar com Google. Tente novamente.');})}else if(b.id==='filter'){searchText=$('q').value.trim();cityFilter=$('city').value;render()}else if(b.id==='logout'){signOut(auth).then(()=>go('profile')).catch(()=>notice('Não foi possível sair.'))}});
document.addEventListener('submit',async e=>{
  if(e.target.id==='storeform'){
    e.preventDefault();if(!user)return notice('Entre com Google primeiro.');
    const f=e.target, b=f.querySelector('button[type=submit]');b.disabled=true;
    const data={ownerId:user.uid,name:f.elements.name.value.trim(),category:f.elements.category.value,city:f.elements.city.value.trim(),phone:f.elements.phone.value.trim(),description:f.elements.description.value.trim(),status:'pending',createdAt:serverTimestamp()};
    try{await setDoc(doc(db,'stores',user.uid),data);notice('Cadastro enviado para aprovação!');await loadStore();}
    catch(err){console.error(err);notice('Erro ao enviar cadastro. Confira sua conexão e tente novamente.');}
    finally{b.disabled=false;}return;
  }
  if(e.target.id==='productform'){
    e.preventDefault();if(!user||store?.status!=='approved')return notice('Cadastro ainda não aprovado.');
    const f=e.target,b=f.querySelector('button[type=submit]');b.disabled=true;
    const data={ownerId:user.uid,storeId:user.uid,name:f.elements.name.value.trim(),price:Number(f.elements.price.value),category:f.elements.category.value,description:f.elements.description.value.trim(),status:'pending',createdAt:serverTimestamp()};
    try{const ref=await addDoc(collection(db,'products'),data);const ids=get('my_products_'+user.uid,[]);put('my_products_'+user.uid,[ref.id,...ids]);notice('Produto enviado para aprovação!');f.reset();await loadMyProducts();}
    catch(err){console.error(err);notice('Não foi possível enviar o produto.');}
    finally{b.disabled=false;}return;
  }
  if(e.target.id==='revisionform'){
    e.preventDefault();if(!user||store?.status!=='approved')return notice('Acesso não autorizado.');
    const p=myProducts.find(x=>x.id===selected);if(!p)return notice('Produto não encontrado.');
    const f=e.target,b=f.querySelector('button[type=submit]');b.disabled=true;
    const changes={name:f.elements.name.value.trim(),price:Number(f.elements.price.value),description:f.elements.description.value.trim()};
    try{await addDoc(collection(db,'product_revisions'),{ownerId:user.uid,productId:p.id,changes,status:'pending',createdAt:serverTimestamp()});notice('Alterações enviadas para aprovação!');go('seller');}
    catch(err){console.error(err);notice('Não foi possível enviar a revisão.');}
    finally{b.disabled=false;}return;
  }
  if(e.target.id==='sendform'){e.preventDefault();let t=$('msg').value.trim();if(!t)return;(messages[selected]??=[]).push(t);put('messages',messages);render()}});
getRedirectResult(auth).catch(err=>console.warn('Retorno do Google:',err.code));
loadPublicProducts();
render();
})();
</script></body></html>
