function availableCities(arr){const map=new Map();arr.forEach(x=>{const city=String(x.city||'').trim(),key=normalizedCity(city);if(key&&key!=='paraguai'&&!map.has(key))map.set(key,city)});return [...map.values()].sort((a,b)=>a.localeCompare(b,'pt-BR'))}
function statusLabel(s){return ({approved:'Aprovado',rejected:'Rejeitado',pending:'Aguardando aprovação',pending_review:'Aguardando nova aprovação',hidden:'Oculto',suspended:'Suspenso',paused:'Pausado'})[s]||s||'Desconhecido'}
function allItems(){return [...items,...realItems]}
function isFav(id){return favorites.includes(String(id))}
function imageUrls(x){return Array.isArray(x?.imageUrls)?x.imageUrls.filter(v=>typeof v==='string'&&v.startsWith(WORKER+'/images/')).slice(0,MAX_PHOTOS):[]}
function photo(x){const src=imageUrls(x)[0];return `<div class="photo">${src?`<img src="${esc(src)}" alt="Foto de ${esc(x.title||x.name)}" loading="lazy">`:esc(x.icon||'📦')}</div>`}
function gallery(x){const urls=imageUrls(x);return urls.length?`<div class="gallery">${urls.map((src,i)=>`<img src="${esc(src)}" alt="Foto ${i+1}" loading="lazy">`).join('')}</div>`:''}
function card(x){return `<div class="card">${photo(x)}<div class="card-body"><span class="pill">${esc(x.cat)}</span><h3 data-user-content style="margin-top:10px">${esc(x.title)}</h3><div class="muted">📍 ${esc(x.city)}</div>${priceBlock(x)}<div class="actions"><button class="primary" data-detail="${esc(x.id)}">Ver detalhes →</button><button class="secondary" data-fav="${esc(x.id)}">${isFav(x.id)?'♥':'♡'}</button></div></div></div>`}
function photoInput(which){return `<label class="formlabel" for="${which}Photos">📷 Fotos do anúncio (até ${MAX_PHOTOS})</label><input class="field" type="file" id="${which}Photos" accept="image/jpeg,image/png,image/webp" multiple><p class="hint">JPG, PNG ou WebP, máximo 5 MB por foto. As imagens passam pela aprovação junto com o anúncio.</p><div class="previews" id="${which}Preview"></div><p class="upload-state" id="${which}Progress" aria-live="polite"></p>`}
function previewFiles(which){const box=$(which+'Preview');if(!box)return;const files=which==='new'?newFiles:revisionFiles;box.replaceChildren();files.forEach((file,i)=>{const div=document.createElement('div');div.className='preview';const img=document.createElement('img');img.alt='Prévia '+(i+1);const url=URL.createObjectURL(file);img.src=url;img.onload=()=>URL.revokeObjectURL(url);const btn=document.createElement('button');btn.type='button';btn.textContent='×';btn.title='Remover foto';btn.dataset.removePhoto=which+':'+i;div.append(img,btn);box.append(div)})}

function qbTranslate(root,locale){
 if(locale==='pt'||!root)return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 let node;while((node=walker.nextNode())){
  if(!node.parentElement||node.parentElement.closest('script,style,textarea,[data-user-content]'))continue;
  const original=node.textContent,trimmed=original.trim();if(!trimmed)continue;
  const bare=trimmed.replace(/^[^\p{L}\p{N}]+/u,'').trim();
  const key=QB_UI_DICTIONARY[trimmed]?trimmed:QB_UI_DICTIONARY[bare]?bare:null;
  if(key){const replacement=QB_UI_DICTIONARY[key][locale];if(replacement)node.textContent=original.replace(key,replacement)}
 }
 root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>{
  for(const attr of ['placeholder','aria-label','title']){
   const p=el.getAttribute(attr);
   if(p&&QB_UI_DICTIONARY[p]?.[locale])el.setAttribute(attr,QB_UI_DICTIONARY[p][locale]);
  }
 });
}

function go(p){if(page==='chat'&&p!=='chat'&&chatUnsub){chatUnsub();chatUnsub=null;}if(uploadBusy)return notice('Aguarde o envio das fotos terminar.');page=p;if(p==='search'||p==='category')loadPublicProducts();if(p==='home'){searchText='';cityFilter='';category=''}window.scrollTo(0,0);render()}
async function loadStore(){const uid=user?.uid;if(!uid)return;storeBusy=true;render();try{const snap=await getDoc(doc(db,'stores',uid));if(user?.uid===uid)store=snap.exists()?{id:snap.id,...snap.data()}:null}catch(err){console.error(err);notice('Não foi possível consultar seu cadastro.')}finally{storeBusy=false;render()}}
async function loadMyProducts(){const uid=user?.uid;if(!uid)return;myProductsBusy=true;if(!uploadBusy)render();try{const ids=get('my_products_'+uid,[]);const found=await Promise.all(ids.map(async id=>{try{const s=await getDoc(doc(db,'products',id));return s.exists()?{id:s.id,...s.data()}:null}catch{return null}}));if(user?.uid===uid)myProducts=found.filter(Boolean)}finally{myProductsBusy=false;if(!uploadBusy)render()}}
async function loadPublicProducts(){realLoading=true;realError='';render();try{const snap=await getDocs(query(collection(db,'products'),where('status','==','approved')));realItems=snap.docs.map(d=>({id:d.id,...d.data(),cat:d.data().category||'Comércios',title:d.data().name||'Anúncio',city:d.data().city||'Paraguai',priceValue:d.data().price,price:d.data().price,currency:d.data().currency||'PYG',rentType:d.data().rentType||'monthly',dailyPrice:d.data().dailyPrice,monthlyPrice:d.data().monthlyPrice,desc:d.data().description||'',icon:'📦',real:true}))}catch(err){console.error(err);realError='Não foi possível carregar anúncios publicados.'}finally{realLoading=false;render()}}
function addFiles(which,fileList){const current=which==='new'?newFiles:revisionFiles;for(const file of Array.from(fileList)){if(current.length>=MAX_PHOTOS){notice('Limite de 5 fotos por anúncio.');break}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){notice('Use somente JPG, PNG ou WebP.');continue}if(!file.size||file.size>MAX_FILE_BYTES){notice('Cada foto deve ter no máximo 5 MB.');continue}if(!current.some(f=>f.name===file.name&&f.size===file.size&&f.lastModified===file.lastModified))current.push(file)}previewFiles(which)}
async function uploadFiles(files,which){if(!files.length)return [];if(!auth.currentUser)throw new Error('Entre novamente com Google.');const token=await auth.currentUser.getIdToken(true),urls=[];for(let i=0;i<files.length;i++){const progress=$(which+'Progress');if(progress)progress.textContent=`Enviando foto ${i+1} de ${files.length}...`;const data=new FormData();data.append('file',files[i],files[i].name);let response;try{response=await fetch(WORKER+'/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:data})}catch{throw new Error('Falha de conexão com o serviço de fotos.')}let result={};try{result=await response.json()}catch{}if(!response.ok||!result.ok||typeof result.url!=='string')throw new Error(result.error||'Falha ao enviar a foto '+(i+1));urls.push(result.url)}return urls}
async function withUpload(form,which,operation){if(uploadBusy)return;uploadBusy=true;const btn=form.querySelector('button[type=submit]');btn.disabled=true;const oldText=btn.textContent;btn.textContent='Aguarde, enviando...';try{const files=[...(which==='new'?newFiles:revisionFiles)];const urls=await uploadFiles(files,which);await operation(urls);if(which==='new')newFiles=[];else revisionFiles=[]}catch(err){console.error(err);notice(err.message||'Erro ao enviar anúncio.');const progress=$(which+'Progress');if(progress)progress.textContent='Envio não concluído. Confira sua conexão e tente novamente.'}finally{uploadBusy=false;btn.disabled=false;btn.textContent=oldText}}
let customerProfile=null,profileBusy=false;
async function loadCustomerProfile(){
 if(!user)return null;
 const uid=user.uid;
 try{const snap=await getDoc(doc(db,'customer_profiles',uid));
 if(user?.uid!==uid)return null;
 customerProfile=snap.exists()?snap.data():null;
 return customerProfile;
 }catch(e){console.error(e);notice('Não foi possível consultar seu cadastro de contato.');return null;}
}
function contactReady(){return !!(customerProfile?.name&&customerProfile?.phone&&customerProfile?.city&&customerProfile?.country)}
async function startInterest(){
 if(!user)return;
 const x=allItems().find(y=>String(y.id)===String(selected));
 if(!x?.real)return notice('Escolha um anúncio publicado para iniciar atendimento.');
 const uid=user.uid;
 const profile=await loadCustomerProfile();
 if(!user||user.uid!==uid||page!=='chat')return;
 if(!profile||!contactReady()){render();return;}
 await openRealChat();
 if(chatThread)return;
 try{await createChatFromProfile(profile,x)}catch(e){console.error(e);notice('Não foi possível abrir a conversa: '+e.message)}
}
async function createChatFromProfile(profile,x){
 const id=chatId();
 const ref=doc(db,'conversations',id);
 const existing=await getDoc(ref);
 if(!existing.exists()){
  try{await setDoc(ref,{customerId:user.uid,customerName:profile.name,customerEmail:user.email,phone:profile.phone,city:profile.city,country:profile.country,productId:String(selected),productName:x.title,storeId:String(x.storeId||''),status:'open',createdAt:serverTimestamp(),updatedAt:serverTimestamp(),consent:true});}
  catch(e){const again=await getDoc(ref);if(!again.exists())throw e;}
 }
 chatThread=id;render();subscribeChat(id);
}
function chatId(){return user?.uid+'_'+String(selected)}
async function openRealChat(){
 if(!user)return;
 if(chatUnsub){chatUnsub();chatUnsub=null;}
 chatThread=null;chatMessages=[];render();
 const id=chatId();
 try{
  const snap=await getDoc(doc(db,'conversations',id));
  if(snap.exists()){chatThread=id;render();subscribeChat(id)}
 }catch(e){console.error(e);notice('Não foi possível abrir o atendimento: '+e.message)}
}
function subscribeChat(id){
 if(chatUnsub)chatUnsub();
 chatUnsub=onSnapshot(query(collection(db,'conversations',id,'messages'),orderBy('createdAt','asc')),snap=>{
  chatMessages=snap.docs.map(d=>d.data());if(page==='chat'){render();const log=$('chatlog');if(log)log.scrollTop=log.scrollHeight}
 },e=>notice('Falha ao carregar mensagens: '+e.message));
}
async function createChat(form){
 if(!auth.currentUser||profileBusy)return notice('Entre com Google primeiro.');
 const name=form.elements.name.value.trim(),phone=form.elements.phone.value.trim(),city=form.elements.city.value.trim(),country=form.elements.country.value;
 if(name.length<3||phone.length<8||!city)return notice('Preencha seus dados corretamente.');
 if(!form.elements.consent.checked)return notice('Confirme a autorização de contato.');
 profileBusy=true;
 try{
  const data={name,phone,city,country,email:user.email,consent:true,updatedAt:serverTimestamp()};
  await setDoc(doc(db,'customer_profiles',user.uid),data);
  customerProfile={...data};
  const x=allItems().find(y=>String(y.id)===String(selected));
  if(page==='chat'&&x?.real)await createChatFromProfile(customerProfile,x);
  else{notice('Seus dados foram salvos.');render()}
 }catch(e){console.error(e);notice('Não foi possível salvar seu cadastro: '+e.message)}
 finally{profileBusy=false}
}
async function sendChatMessage(text){
 if(chatBusy||!chatThread||!user)return;
 chatBusy=true;
 try{await addDoc(collection(db,'conversations',chatThread,'messages'),{senderId:user.uid,senderRole:'customer',text,createdAt:serverTimestamp()});}
 catch(e){console.error(e);notice('Não foi possível enviar: '+e.message)}finally{chatBusy=false}
}
async function checkAdmin(uid){
  adminAuthorized=false;
  adminChecking=true;
  render();
  try{
    const snapshot=await getDoc(doc(db,'users',uid));
    if(user?.uid===uid){
      const data=snapshot.exists()?snapshot.data():null;
      adminAuthorized=data?.role==='admin'&&data?.active===true;
    }
  }catch(err){
    console.error('Falha ao verificar acesso administrativo:',err);
    if(user?.uid===uid)adminAuthorized=false;
  }finally{
    if(user?.uid===uid){adminChecking=false;render()}
  }
}
onAuthStateChanged(auth,account=>{user=account?{name:account.displayName||'Usuário',email:account.email||'',uid:account.uid}:null;adminAuthorized=false;adminChecking=false;if(user){loadStore();loadMyProducts();checkAdmin(user.uid);loadCustomerProfile()}else{store=null;myProducts=[];customerProfile=null}if(page==='login'&&user){const wantsChat=!!pending;go(wantsChat?'chat':'profile');pending=null;if(wantsChat)startInterest()}else render()});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='newadshortcut'){document.getElementById('qb-new-ad')?.scrollIntoView({behavior:'smooth',block:'start'});document.querySelector('#productform input[name=name]')?.focus({preventScroll:true});return}if(b.id==='myadsshortcut'){document.getElementById('qb-my-ads')?.scrollIntoView({behavior:'smooth',block:'start'});return}if(b.dataset.lang){lang=b.dataset.lang;localStorage.setItem('qb_lang',lang);render();return}if(b.dataset.removePhoto){const [which,index]=b.dataset.removePhoto.split(':');const files=which==='new'?newFiles:revisionFiles;files.splice(Number(index),1);previewFiles(which);return}if(b.dataset.cat!==undefined){category=cats[Number(b.dataset.cat)][0];searchText='';cityFilter='';go('category')}else if(b.dataset.detail){selected=b.dataset.detail;go('detail')}else if(b.dataset.fav){const id=String(b.dataset.fav);favorites=isFav(id)?favorites.filter(x=>x!==id):[...favorites,id];put('favorites',favorites);render()}else if(b.dataset.interest){selected=b.dataset.interest;if(user){go('chat');startInterest()}else{pending=selected;go('login')}}else if(b.dataset.edit){selected=b.dataset.edit;revisionFiles=[];go('editproduct')}else if(b.dataset.go)go(b.dataset.go);else if(b.id==='openadmin'){if(adminAuthorized&&auth.currentUser?.uid===user?.uid){window.location.assign('./admin.html')}else notice('Acesso administrativo não autorizado.')}else if(b.id==='refreshstore')loadStore();else if(b.id==='refreshproducts')loadMyProducts();else if(b.id==='google')signInWithPopup(auth,provider).catch(err=>{console.error(err);notice(err.code==='auth/popup-blocked'?'Permita pop-ups para entrar com Google.':err.code==='auth/unauthorized-domain'?'Domínio não autorizado no Firebase.':'Não foi possível entrar com Google.')});else if(b.id==='filter'){searchText=$('q').value.trim();cityFilter=$('city').value;render()}else if(b.id==='logout')signOut(auth).then(()=>go('profile')).catch(()=>notice('Não foi possível sair.'))});
document.addEventListener('change',e=>{if(e.target.id==='rentFilter'){rentFilter=e.target.value;render()}else if(e.target.matches('#productform select[name=category],#productform select[name=rentType]')){toggleRental('new')}else if(e.target.matches('#revisionform select[name=category],#revisionform select[name=rentType]')){toggleRental('revision')}else if(e.target.id==='categoryCity'){cityFilter=e.target.value;render()}else if(e.target.id==='newPhotos'||e.target.id==='revisionPhotos'){addFiles(e.target.id==='newPhotos'?'new':'revision',e.target.files);e.target.value=''}});
document.addEventListener('submit',async e=>{
if(e.target.id==='storeform'){e.preventDefault();if(!user)return notice('Entre com Google primeiro.');const f=e.target,b=f.querySelector('button[type=submit]');b.disabled=true;const data={ownerId:user.uid,name:f.elements.name.value.trim(),category:f.elements.category.value,city:f.elements.city.value.trim(),phone:f.elements.phone.value.trim(),description:f.elements.description.value.trim(),status:'pending',createdAt:serverTimestamp()};try{await setDoc(doc(db,'stores',user.uid),data);notice('Cadastro enviado para aprovação!');await loadStore()}catch(err){console.error(err);notice('Erro ao enviar cadastro. Confira sua conexão.')}finally{b.disabled=false}return}
if(e.target.id==='productform'){e.preventDefault();if(!user||store?.status!=='approved')return notice('Cadastro ainda não aprovado.');const f=e.target;await withUpload(f,'new',async urls=>{const data={ownerId:user.uid,storeId:user.uid,name:f.elements.name.value.trim(),price:Number(f.elements.price.value),currency:f.elements.currency.value,category:f.elements.category.value,description:f.elements.description.value.trim(),imageUrls:urls,status:'pending',createdAt:serverTimestamp()};if(data.category==='Aluguéis'){data.rentType=f.elements.rentType.value;if(data.rentType==='both'){data.dailyPrice=Number(f.elements.dailyPrice.value);data.monthlyPrice=Number(f.elements.monthlyPrice.value);if(!f.elements.dailyPrice.value||!f.elements.monthlyPrice.value)throw Error('Informe os dois valores do aluguel.')}}const ref=await addDoc(collection(db,'products'),data);const ids=get('my_products_'+user.uid,[]);put('my_products_'+user.uid,[ref.id,...ids]);notice('Anúncio enviado para aprovação! Você já pode criar outro.');f.reset();await loadMyProducts();newFiles=[];render();window.scrollTo({top:0,behavior:'smooth'})});return}
if(e.target.id==='revisionform'){e.preventDefault();if(!user||store?.status!=='approved')return notice('Acesso não autorizado.');const p=myProducts.find(x=>x.id===selected);if(!p)return notice('Produto não encontrado.');const f=e.target;await withUpload(f,'revision',async urls=>{const changes={name:f.elements.name.value.trim(),price:Number(f.elements.price.value),currency:f.elements.currency.value,category:f.elements.category.value,description:f.elements.description.value.trim()};if(changes.category==='Aluguéis'){changes.rentType=f.elements.rentType.value;if(changes.rentType==='both'){changes.dailyPrice=Number(f.elements.dailyPrice.value);changes.monthlyPrice=Number(f.elements.monthlyPrice.value);if(!f.elements.dailyPrice.value||!f.elements.monthlyPrice.value)throw Error('Informe os dois valores do aluguel.')}}if(urls.length)changes.imageUrls=urls;const fresh=await getDoc(doc(db,'products',p.id));if(!fresh.exists()||fresh.data().ownerId!==user.uid||!['approved','pending_review'].includes(fresh.data().status))throw Error('Anúncio indisponível para alteração.');const revisionRef=doc(collection(db,'product_revisions'));const batch=writeBatch(db);batch.set(revisionRef,{ownerId:user.uid,productId:p.id,changes,status:'pending',createdAt:serverTimestamp()});if(fresh.data().status==='approved')batch.update(doc(db,'products',p.id),{status:'pending_review'});await batch.commit();notice('Alteração enviada! Anúncio oculto até nova aprovação.');await loadMyProducts();await loadPublicProducts();page='seller';render()});return}
if(e.target.id==='contactform'){e.preventDefault();await createChat(e.target)}
if(e.target.id==='sendform'){e.preventDefault();const t=$('msg').value.trim();if(!t)return;$('msg').value='';await sendChatMessage(t)}});
getRedirectResult(auth).catch(err=>console.warn('Retorno do Google:',err.code));loadPublicProducts();loadRates();render();
</script></body></html>
