<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b38"><title>Que Buscas Paraguai — Login Google</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#173e75,#081a37 55%,#061329);color:#fff;font:16px system-ui,-apple-system,Arial;min-height:100dvh}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:30px 18px 15px;text-align:center}.pin{font-size:42px}.logo{font-weight:900;font-style:italic;font-size:43px;letter-spacing:-2px}.logo em{color:#ff3149}.logo span{color:white}.stripe{height:5px;border-radius:100%;background:linear-gradient(90deg,#ef173c 0 48%,#126de8 50%);width:230px;margin:5px auto 15px}.tag{letter-spacing:4px;color:#d1dced;font-size:13px}.sub{color:#d0d9e9;font-size:14px;margin-top:13px}.wrap{max-width:620px;margin:auto;padding:12px 17px 105px}.cat{border:0;color:white;width:100%;border-radius:22px;display:flex;align-items:center;text-align:left;gap:17px;padding:19px 20px;margin:0 0 13px;font-size:23px;font-weight:750;box-shadow:inset 0 1px #ffffff33}.cat .ico{font-size:30px;width:37px}.cat .arrow{margin-left:auto}.blue{background:#1064c6}.green{background:#00875c}.orange{background:#ee9808}.red{background:#d51335}.purple{background:#6548b2}.teal{background:#16899c}.top{display:flex;align-items:center;gap:12px;padding:18px 16px 8px;max-width:620px;margin:auto}.back{background:#203d67;border:1px solid #416089;color:white;border-radius:12px;padding:9px 13px}.title{font-size:25px;font-weight:800;margin:0}.muted{color:#b5c8e5}.card{background:#132e54;border:1px solid #345780;border-radius:19px;margin:12px 0;overflow:hidden}.card-body{padding:16px}.card h3{margin:0 0 6px;font-size:20px}.pill{display:inline-block;background:#215d9b;border-radius:25px;padding:5px 10px;font-size:12px}.price{font-size:22px;font-weight:800;margin:10px 0}.photo{height:145px;background:linear-gradient(135deg,#245a8f,#0e2545);display:flex;align-items:center;justify-content:center;font-size:64px}.actions{display:flex;gap:9px;margin-top:14px}.primary,.secondary{border:0;border-radius:12px;padding:12px 15px;color:white;font-weight:700}.primary{background:#116de3}.secondary{background:#29466b}.actions button:first-child{flex:1}.field{width:100%;background:#10284a;border:1px solid #47648c;color:white;padding:13px;border-radius:12px;margin:8px 0 12px}.field::placeholder{color:#aabbd3}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters .field{margin:5px 0}.filters input{grid-column:1/-1}.nav{position:fixed;bottom:0;left:0;right:0;background:#071a36f5;border-top:1px solid #345780;display:flex;justify-content:space-around;padding:10px 2px calc(12px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:none;color:#c5d3e8;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}.nav button b{font-size:21px}.nav .active{color:#5eafff}.empty{padding:26px 16px;text-align:center;color:#b9cce5}.small{font-size:13px;color:#b6c9e1}.chatlog{height:290px;overflow:auto;background:#091d38;border:1px solid #345780;border-radius:15px;padding:13px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:85%;background:#225ca4;padding:11px 13px;border-radius:15px;align-self:flex-end;overflow-wrap:anywhere}.bubble.bot{background:#29405f;align-self:flex-start}.hidden{display:none!important}a{color:#9dcaff}.section{margin:20px 0 10px;font-weight:800}#notice{position:fixed;top:12px;left:10%;width:80%;background:#f7fafc;color:#10233e;padding:13px;border-radius:13px;z-index:20;box-shadow:0 8px 30px #0006;display:none} </style></head><body>
<div id="app"></div><div id="notice"></div><nav class="nav" id="nav"></nav>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyCjZ7bXEYtNzgIaScbsLjRKt0fCjq_IyX8",
  authDomain: "que-buscas-paraguai-1b5b1.firebaseapp.com",
  projectId: "que-buscas-paraguai-1b5b1",
  storageBucket: "que-buscas-paraguai-1b5b1.firebasestorage.app",
  messagingSenderId: "833573657428",
  appId: "1:833573657428:web:164d20836d2e05c7eb86c1"
};
const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const provider = new GoogleAuthProvider();
(function(){'use strict';
const cats=[['Aluguel','🏠','blue'],['Terrenos','📍','green'],['Restaurantes','🍽️','orange'],['Empregos','💼','red'],['Imóveis à venda','🏡','purple'],['Serviços','🛠️','teal']];
const items=[{id:1,cat:'Aluguel',title:'Casa para alugar',city:'Ciudad del Este',price:'Gs. 2.500.000/mês',desc:'Casa com 3 quartos, 2 banheiros e garagem.',icon:'🏠'},{id:2,cat:'Aluguel',title:'Apartamento central',city:'Asunción',price:'Gs. 3.200.000/mês',desc:'Apartamento com 2 quartos próximo ao centro.',icon:'🏢'},{id:3,cat:'Terrenos',title:'Terreno residencial 360 m²',city:'Hernandarias',price:'US$ 28.000',desc:'Terreno plano com acesso por rua pavimentada.',icon:'🌳'},{id:4,cat:'Restaurantes',title:'Restaurante demonstrativo',city:'Ciudad del Este',price:'Consultar cardápio',desc:'Exemplo de anúncio de restaurante.',icon:'🍽️'},{id:5,cat:'Empregos',title:'Vaga de atendente',city:'Asunción',price:'Salário a combinar',desc:'Exemplo de oportunidade de emprego.',icon:'💼'},{id:6,cat:'Imóveis à venda',title:'Casa à venda',city:'Ciudad del Este',price:'US$ 95.000',desc:'Casa com 3 quartos e pátio.',icon:'🏡'},{id:7,cat:'Serviços',title:'Serviços de manutenção',city:'Encarnación',price:'Solicitar orçamento',desc:'Exemplo de anúncio de prestador de serviços.',icon:'🛠️'}];
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function get(k,d){try{return JSON.parse(localStorage.getItem('qb_'+k))??d}catch(e){return d}}function put(k,v){try{localStorage.setItem('qb_'+k,JSON.stringify(v))}catch(e){}}
let user=null,favorites=get('favorites',[]),messages=get('messages',{}),page='home',category='',selected=null,pending=null,searchText='',cityFilter='';
onAuthStateChanged(auth, account => {
  user = account ? {name:account.displayName||'Usuário', email:account.email||'', phone:'', uid:account.uid} : null;
  if (page==='login' && user) { go(pending ? 'chat' : 'profile'); pending=null; }
  else render();
});
function notice(t){$('notice').textContent=t;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',2600)}
function render(){let h='';if(page==='home'){h=`<header><div class="pin">📍</div><div class="logo"><em>Que</em> <span>Buscas</span></div><div class="stripe"></div><div class="tag">PARAGUAI 🇵🇾</div><div class="sub">Encontre o que procura no Paraguai</div></header><main class="wrap">${cats.map((c,i)=>`<button class="cat ${c[2]}" data-cat="${i}"><span class="ico">${c[1]}</span>${c[0]}<span class="arrow">›</span></button>`).join('')}<p class="small" style="text-align:center">Versão demonstrativa • anúncios fictícios</p></main>`}
else if(page==='category'||page==='search'||page==='favorites'){let title=page==='category'?category:page==='search'?'Buscar anúncios':'Meus favoritos';let arr=items.filter(x=>(page==='category'?x.cat===category:page==='favorites'?favorites.includes(x.id):true)&&(!searchText||[x.title,x.city,x.cat].join(' ').toLowerCase().includes(searchText.toLowerCase()))&&(!cityFilter||x.city===cityFilter));h=`<div class="top"><button class="back" data-go="home">‹ Voltar</button><h1 class="title">${esc(title)}</h1></div><main class="wrap">${page==='search'?`<div class="filters"><input class="field" id="q" placeholder="Buscar imóvel, serviço, cidade..." value="${esc(searchText)}"><select class="field" id="city"><option value="">Todas as cidades</option>${[...new Set(items.map(x=>x.city))].map(x=>`<option ${x===cityFilter?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="secondary" id="filter">Pesquisar</button></div>`:''}${arr.length?arr.map(card).join(''):'<div class="empty">Nenhum anúncio encontrado.</div>'}</main>`}
else if(page==='detail'){let x=items.find(y=>y.id===selected);h=`<div class="top"><button class="back" data-go="${category?'category':'search'}">‹ Voltar</button><h1 class="title">Detalhes</h1></div><main class="wrap"><div class="card"><div class="photo">${x.icon}</div><div class="card-body"><span class="pill">${esc(x.cat)}</span><h3 style="margin-top:12px">${esc(x.title)}</h3><div class="muted">📍 ${esc(x.city)}, Paraguai</div><div class="price">${esc(x.price)}</div><p>${esc(x.desc)}</p><div class="actions"><button class="primary" data-interest="${x.id}">💬 Tenho interesse</button><button class="secondary" data-fav="${x.id}">${favorites.includes(x.id)?'♥':'♡'}</button></div></div></div><p class="small">Anúncio fictício para teste da navegação.</p></main>`}
else if(page==='login'){h=`<div class="top"><button class="back" data-go="home">‹ Voltar</button><h1 class="title">Entrar com Google</h1></div><main class="wrap"><div class="card"><div class="card-body"><p>Entre com sua conta Google para demonstrar interesse em um imóvel.</p><button class="primary" style="width:100%" id="google">🌐 Continuar com Google</button><p class="small">O acesso de parceiros, atendentes e administradores será liberado separadamente, após autorização.</p></div></div></main>`}
else if(page==='chat'){let x=items.find(y=>y.id===selected),arr=messages[selected]||[];h=`<div class="top"><button class="back" data-go="detail">‹ Voltar</button><h1 class="title">Chat de teste</h1></div><main class="wrap"><p class="muted">Sobre: ${esc(x.title)} • ${esc(x.city)}</p><div class="chatlog" id="chatlog"><div class="bubble bot">Olá! Esta é uma demonstração do chat. As mensagens ficam somente neste aparelho e não chegam à equipe.</div>${arr.map(m=>`<div class="bubble">${esc(m)}</div>`).join('')}</div><form id="sendform" class="actions"><input class="field" id="msg" style="margin:0;min-width:0;flex:1" placeholder="Escreva sua mensagem" required><button class="primary" type="submit">Enviar</button></form></main>`}
else if(page==='profile'){h=`<div class="top"><button class="back" data-go="home">‹ Voltar</button><h1 class="title">Meu perfil</h1></div><main class="wrap"><div class="card"><div class="card-body">${user?`<h3>${esc(user.name)}</h3><p>${esc(user.email)}<br></p><button class="secondary" id="logout">Sair da conta Google</button>`:`<p>Você está navegando como visitante.</p><button class="primary" data-go="login">Entrar com Google</button>`}</div></div></main>`}
$('app').innerHTML=h;$('nav').innerHTML=[['home','⌂','Início'],['search','⌕','Buscar'],['favorites','♡','Favoritos'],['profile','♙','Perfil']].map(x=>`<button data-go="${x[0]}" class="${page===x[0]?'active':''}"><b>${x[1]}</b>${x[2]}</button>`).join('');if(page==='chat')$('chatlog').scrollTop=$('chatlog').scrollHeight;}
function card(x){return `<div class="card"><div class="photo">${x.icon}</div><div class="card-body"><span class="pill">${esc(x.cat)}</span><h3 style="margin-top:10px">${esc(x.title)}</h3><div class="muted">📍 ${esc(x.city)}</div><div class="price">${esc(x.price)}</div><div class="actions"><button class="primary" data-detail="${x.id}">Ver detalhes →</button><button class="secondary" data-fav="${x.id}">${favorites.includes(x.id)?'♥':'♡'}</button></div></div></div>`}
function go(p){page=p;if(p==='home'){searchText='';cityFilter='';category=''}window.scrollTo(0,0);render()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.cat!==undefined){category=cats[+b.dataset.cat][0];searchText='';cityFilter='';go('category')}else if(b.dataset.detail){selected=+b.dataset.detail;go('detail')}else if(b.dataset.fav){let id=+b.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];put('favorites',favorites);render()}else if(b.dataset.interest){selected=+b.dataset.interest;if(user)go('chat');else{pending=selected;go('login')}}else if(b.dataset.go){go(b.dataset.go)}else if(b.id==='google'){signInWithPopup(auth,provider).catch(err=>{console.error(err);notice(err.code==='auth/popup-blocked'?'O navegador bloqueou a janela de login. Permita pop-ups e tente novamente.':err.code==='auth/unauthorized-domain'?'Domínio não autorizado no Firebase.':'Não foi possível entrar com Google. Tente novamente.');})}else if(b.id==='filter'){searchText=$('q').value.trim();cityFilter=$('city').value;render()}else if(b.id==='logout'){signOut(auth).then(()=>go('profile')).catch(()=>notice('Não foi possível sair.'))}});
document.addEventListener('submit',e=>{if(e.target.id==='sendform'){e.preventDefault();let t=$('msg').value.trim();if(!t)return;(messages[selected]??=[]).push(t);put('messages',messages);render()}});
render();
})();
</script></body></html>
